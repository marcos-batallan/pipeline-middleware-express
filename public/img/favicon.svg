<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Favicon de reserva de salas de estudio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#1E3A34"/>

  <!-- Libro simplificado (trazos rectos, sin curvas) -->
  <polygon points="30,16 14,20 14,44 30,40" fill="#F6F1E4"/>
  <polygon points="34,16 50,20 50,44 34,40" fill="#F6F1E4"/>
  <line x1="32" y1="15" x2="32" y2="41" stroke="#16281F" stroke-width="2"/>

  <!-- Insignia de reloj, más grande y con trazos gruesos -->
  <circle cx="48" cy="48" r="13" fill="#E2A63B" stroke="#1E3A34" stroke-width="3"/>
  <line x1="48" y1="48" x2="48" y2="39" stroke="#F6F1E4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="48" x2="55" y2="48" stroke="#F6F1E4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="1.5" fill="#1E3A34"/>
</svg>
